[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediafire-dl"
version = "0.1.0"
description = "A clean MediaFire file and folder downloader with a Rich-powered CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = []
dependencies = [
  "rich>=13.7.0",
]
keywords = ["mediafire", "downloader", "cli", "rich"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/worstgirlinamerica/mediafire-dl"
Repository = "https://github.com/worstgirlinamerica/mediafire-dl"
Issues = "https://github.com/worstgirlinamerica/mediafire-dl/issues"

[project.scripts]
mediafire-dl = "mediafire_dl.cli:main"

[tool.setuptools.packages.find]
include = ["mediafire_dl*"]
